name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NVIM_VERSION: v0.12.6
  GOFLAGS: -tags=mygo_nowebview

defaults:
  run:
    shell: bash

jobs:
  test:
    name: vet + test (Linux, real Neovim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Neovim (pinned release)
        run: |
          curl -fsSL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-linux-x86_64.tar.gz" | tar xz -C "$HOME"
          echo "$HOME/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NVIM_BIN=$HOME/nvim-linux-x86_64/bin/nvim" >> "$GITHUB_ENV"
      - run: nvim --version | head -3
      - run: go vet ./...
      - run: go test -count=1 -race -json ./... | tee test-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: test-results.jsonl

  unit:
    name: vet + test (${{ matrix.os }}, real Neovim)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Neovim (macOS)
        if: runner.os == 'macOS'
        run: |
          case "$RUNNER_ARCH" in
            ARM64) arch=arm64 ;;
            X64) arch=x86_64 ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/neovim/neovim/releases/download/$NVIM_VERSION/nvim-macos-$arch.tar.gz" | tar xz -C "$HOME"
          echo "$HOME/nvim-macos-$arch/bin" >> "$GITHUB_PATH"
          echo "NVIM_BIN=$HOME/nvim-macos-$arch/bin/nvim" >> "$GITHUB_ENV"
      - name: Install Neovim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nvim.zip'
          Invoke-WebRequest "https://github.com/neovim/neovim/releases/download/$env:NVIM_VERSION/nvim-win64.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $bin = Join-Path $env:RUNNER_TEMP 'nvim-win64/bin'
          $bin >> $env:GITHUB_PATH
          "NVIM_BIN=$(Join-Path $bin 'nvim.exe')" >> $env:GITHUB_ENV
      - run: nvim --version
      - run: go vet ./...
      - run: go test -count=1 -json ./... | tee test-results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.jsonl

  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }} ${{ matrix.tags }} (no cgo)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: amd64, tags: mygo_nowebview}
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOFLAGS: -tags=${{ matrix.tags }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go build -o /dev/null .

  package:
    name: package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, platform: windows}
          - {os: macos-latest, platform: macos}
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Package Windows portable build
        if: matrix.platform == 'windows'
        run: |
          go tool mygo build -platform windows/amd64 -skip-installer
          test -s build/windows-amd64/MyGoNVim.exe
          mkdir -p build/windows-amd64/data
          (cd build/windows-amd64 && zip -r ../windows-amd64-portable.zip . -x '.mygo-files')
      - name: Package macOS apps and disk images
        if: matrix.platform == 'macos'
        run: |
          go tool mygo build -platform darwin/arm64,darwin/amd64 -skip-notarize
          for arch in arm64 amd64; do
            dir="build/darwin-$arch"
            test -s "$dir/MyGoNVim.app/Contents/MacOS/MyGoNVim"
            ditto -c -k --keepParent "$dir/MyGoNVim.app" "build/macos-$arch.zip"
            test -n "$(find "$dir" -name '*.dmg' -print -quit)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.platform }}
          path: |
            build/*.zip
            build/darwin-*/*.dmg
          if-no-files-found: error
